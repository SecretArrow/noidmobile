name: Build WASM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: wasm-pack build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/noidmobile-pow

      - name: Install wasm-pack
        uses: jetli/action-install-wasm-pack@v0.4.0
        with:
          version: latest

      - name: wasm-pack build
        working-directory: rust/noidmobile-pow
        run: wasm-pack build --target web --release

      - name: Stage artifacts into public/wasm/ (served by Next.js)
        run: |
          mkdir -p public/wasm
          cp -r rust/noidmobile-pow/pkg/* public/wasm/
          ls -la public/wasm/

      - name: Upload wasm pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: noidmobile-wasm
          path: rust/noidmobile-pow/pkg/
          if-no-files-found: error
          retention-days: 14

      - name: Commit artifacts back to repo (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'ci: rebuild WASM [skip ci]'
          file_pattern: 'public/wasm/*'
          commit_user_name: 'noidmobile-ci'
          commit_user_email: 'ci@noidmobile.local'
