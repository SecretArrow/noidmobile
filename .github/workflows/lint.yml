name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-lint:
    name: Web (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  rust-lint:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/noidmobile-pow
      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path rust/noidmobile-pow/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path rust/noidmobile-pow/Cargo.toml --all-targets -- -D warnings

  android-lint:
    name: Android (Gradle lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.3.11579264 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

  stratum-typecheck:
    name: Stratum bridge (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stratum/package.json
      - working-directory: stratum
        run: |
          npm install
          npx tsc --noEmit
