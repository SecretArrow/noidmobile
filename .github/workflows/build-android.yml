name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Required so the softprops/action-gh-release step can create a Release.
permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.3.11579264 cmake;3.22.1 platforms;android-34 build-tools;34.0.0'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/noidmobile-pow
            rust/noidmobile-stratum

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust PoW crate for Android ABIs
        working-directory: rust/noidmobile-pow
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -t armeabi-v7a \
              -o ../../android/app/src/main/jniLibs build --release
          ls -la ../../android/app/src/main/jniLibs/*/

      - name: Build Rust Stratum V2 crate for Android ABIs
        working-directory: rust/noidmobile-stratum
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -t armeabi-v7a \
              -o ../../android/app/src/main/jniLibs build --release
          ls -la ../../android/app/src/main/jniLibs/*/

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore (if provided)
        id: keystore
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret set — building unsigned release."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/noidmobile.keystore
          echo "keystore_file=$RUNNER_TEMP/noidmobile.keystore" >> $GITHUB_OUTPUT

      - name: Assemble release APK + AAB
        working-directory: android
        env:
          NOID_KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_file }}
          NOID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Use system gradle (set up by gradle/actions/setup-gradle) since the
        # repo doesn't ship gradlew/gradle-wrapper.jar.
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace --no-build-cache

      - name: Locate build-tools (for apksigner + zipalign + aapt)
        id: buildtools
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "build_tools_dir=$BT" >> $GITHUB_OUTPUT
          echo "Found build-tools at: $BT"
          ls "$BT" | head -20

      - name: Verify APK signature + alignment
        shell: bash
        run: |
          set -e
          BT="${{ steps.buildtools.outputs.build_tools_dir }}"
          APK_DIR="android/app/build/outputs/apk/release"
          echo "=== APK files produced ==="
          ls -la "$APK_DIR/"
          APK=$(ls "$APK_DIR"/app-release*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "⚠ No signed release APK found — falling back to unsigned."
            APK=$(ls "$APK_DIR"/app-release-unsigned.apk 2>/dev/null | head -1)
          fi
          echo "Inspecting: $APK"
          echo ""
          echo "=== zipalign check ==="
          "$BT/zipalign" -c -v 4 "$APK" 2>&1 | tail -10 || echo "(zipalign not yet applied — that's OK, apksigner re-aligns post-signing)"
          echo ""
          echo "=== apksigner verify --verbose ==="
          "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 || {
            echo "❌ apksigner verify FAILED — APK will not install on Android!"
            exit 1
          }
          echo ""
          echo "=== aapt badging (sanity check) ==="
          "$BT/aapt" dump badging "$APK" 2>&1 | head -25
          echo ""
          echo "✅ APK passes signature + alignment + manifest checks."

      - name: Rename APK to a friendly name
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          APK=$(ls "$APK_DIR"/app-release.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(ls "$APK_DIR"/app-release-unsigned.apk 2>/dev/null | head -1)
          fi
          VERSION="${GITHUB_REF_NAME:-v0.0.0}"
          cp "$APK" "noidmobile-${VERSION}.apk"
          echo "Final APK: noidmobile-${VERSION}.apk ($(stat -c%s noidmobile-${VERSION}.apk) bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noidmobile-android-apk
          path: noidmobile-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: noidmobile-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release on tag push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            noidmobile-*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
