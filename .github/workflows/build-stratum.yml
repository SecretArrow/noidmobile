name: Build Stratum

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'stratum/**'
      - '.github/workflows/build-stratum.yml'

jobs:
  typecheck:
    name: Stratum bridge — tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stratum/package.json
      - working-directory: stratum
        run: |
          npm install
          npx tsc --noEmit
