[package]
name = "noidmobile_stratum"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stratum V2 client (Noise_NX) for connecting Android miners directly to peakpool"
repository = "https://github.com/SecretArrow/noidmobile"
readme = "README.md"

[lib]
name = "noidmobile_stratum"
crate-type = ["cdylib", "rlib"]

[dependencies]
snow = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
